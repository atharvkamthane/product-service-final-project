<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Service</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    label { display: inline-block; margin: .5rem .75rem .5rem 0; }
    input, select, button { padding: .45rem; margin-top: .25rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: .55rem; text-align: left; }
    #flash_message { min-height: 1.4rem; margin: .5rem 0; color: #176b35; }
  </style>
</head>
<body>
  <h1>Product Service</h1>
  <div id="flash_message" role="status">{{ flash_message }}</div>

  <form id="search_form" action="/" method="get">
    <label for="name">Name
      <input id="name" name="name" value="{{ filters.name }}">
    </label>
    <label for="category">Category
      <select id="category" name="category">
        <option value="">All</option>
        {% for value in ["Food", "Clothing", "Electronics", "Housewares"] %}
          <option value="{{ value }}" {% if filters.category == value %}selected{% endif %}>{{ value }}</option>
        {% endfor %}
      </select>
    </label>
    <label for="available">Available
      <select id="available" name="available">
        <option value="">All</option>
        <option value="true" {% if filters.available == "true" %}selected{% endif %}>true</option>
        <option value="false" {% if filters.available == "false" %}selected{% endif %}>false</option>
      </select>
    </label>
    <input type="hidden" name="searched" value="1">
    <button type="submit" id="search-btn">Search</button>
    <button type="button" id="clear-btn" onclick="window.location.href='/'">Clear</button>
  </form>

  <h2>Search Results</h2>
  <table id="search_results">
    <thead>
      <tr>
        <th>ID</th><th>Name</th><th>Description</th><th>Category</th><th>Available</th><th>Price</th>
      </tr>
    </thead>
    <tbody>
      {% for product in products %}
      <tr data-product-id="{{ product.id }}">
        <td class="product-id">{{ product.id }}</td>
        <td class="product-name">{{ product.name }}</td>
        <td class="product-description">{{ product.description }}</td>
        <td class="product-category">{{ product.category }}</td>
        <td class="product-available">{{ product.available|string|lower }}</td>
        <td class="product-price">{{ "%.2f"|format(product.price) }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
